          - generic [ref=e65]: 👋
        - paragraph [ref=e66]: I'm a Software Development Engineer with ~2 years of full-time engineering experience. I currently work at Chainscore Labs, where I started as an intern and now contribute as a full-time SDE.
        - paragraph [ref=e67]: "My day-to-day spans the full stack and goes a few layers below it. I've built complete trading frontends in Next.js / React / TypeScript, shipped Nest.js, Node.js / Express APIs with WebSocket services supporting thousands of concurrent users, and currently work on lower-level systems: architecting computational pipelines and consensus mechanisms in Python, and contributing to a high-performance SDK in C for a decentralized compute protocol (JAM, in the Polkadot ecosystem)."
        - paragraph [ref=e68]: Less than any single domain, what pulls me in are problems where correctness, performance, and concurrency actually matter - APIs under load, real-time data, networking, protocols, virtual machines.
        - paragraph [ref=e69]: Outside of work
